<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard — RestaurantMS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>🍽 RestaurantMS</h2>
            <p>Nhân viên phục vụ</p>
        </div>
        <nav>
            <a class="nav-item active" href="dashboard-staff.html">
                <span class="nav-icon">🪑</span> Sơ đồ bàn
            </a>
            <a class="nav-item" href="order-new.html">
                <span class="nav-icon">📋</span> Gọi món
            </a>
            <a class="nav-item" href="checkout.html">
                <span class="nav-icon">💳</span> Thanh toán
            </a>
            <a class="nav-item" href="reservations.html">
                <span class="nav-icon">📅</span> Đặt bàn
            </a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="user-name" id="sidebarName">...</div>
                <div class="user-role">Nhân viên phục vụ</div>
            </div>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-title">Sơ đồ bàn</div>
        <div class="page-sub">Chọn bàn để bắt đầu gọi món</div>

        <!-- Legend -->
        <div style="display:flex;gap:16px;margin-bottom:20px;">
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
                <div style="width:14px;height:14px;border-radius:3px;background:#16a34a;"></div> Trống
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
                <div style="width:14px;height:14px;border-radius:3px;background:#dc2626;"></div> Đang phục vụ
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:13px;">
                <div style="width:14px;height:14px;border-radius:3px;background:#d97706;"></div> Đã đặt trước
            </div>
        </div>

        <div style="background:#fff;border-radius:12px;padding:24px;border:1px solid #eee;text-align:center;color:#aaa;">
            🪑 Sơ đồ bàn sẽ hiển thị ở đây (Ngày 12)
            <a class="nav-item active" href="table-map.html">
                <span class="nav-icon">🪑</span> Sơ đồ bàn
            </a>
        </div>
    </main>
</div>

<script src="../js/auth.js"></script>
<script>
    requireRole('Admin', 'Staff');
    document.getElementById('sidebarName').textContent = getFullName();
</script>
</body>
</html>
