<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực đơn — RestaurantMS</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/menu-public.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>🍽 RestaurantMS</h2>
            <p>Khách hàng</p>
        </div>
        <nav>
            <a class="nav-item" href="dashboard-customer.html">
                <span class="nav-icon">🏠</span> Trang chủ
            </a>
            <a class="nav-item active" href="menu-public.html">
                <span class="nav-icon">🍜</span> Thực đơn
            </a>
            <a class="nav-item" href="booking.html">
                <span class="nav-icon">📅</span> Đặt bàn
            </a>
            <a class="nav-item" href="my-reservations.html">
                <span class="nav-icon">📋</span> Đặt bàn của tôi
            </a>
            <a class="nav-item" href="profile.html">
                <span class="nav-icon">👤</span> Tài khoản
            </a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="user-name" id="sidebarName"></div>
                <div class="user-role">Khách hàng</div>
            </div>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>
    </aside>

    <main class="main-content">
        <!-- Header -->
        <div class="menu-header">
            <div class="menu-title">🍽️ Thực Đơn</div>
            <div class="menu-subtitle" id="menuCount">Đang tải thực đơn...</div>
        </div>

        <!-- Search -->
        <div class="menu-search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput"
                   placeholder="Tìm kiếm món ăn yêu thích..."
                   oninput="onSearch()">
        </div>

        <!-- Category tabs -->
        <div class="menu-cat-tabs" id="catTabs"></div>

        <!-- Loading shimmer -->
        <div id="loadingArea" style="display:none;">
            <div class="menu-list">
                <div class="shimmer-card">
                    <div class="shimmer-img"></div>
                    <div class="shimmer-body">
                        <div class="shimmer-line title"></div>
                        <div class="shimmer-line desc"></div>
                        <div class="shimmer-line desc2"></div>
                        <div class="shimmer-line price"></div>
                    </div>
                </div>
                <div class="shimmer-card">
                    <div class="shimmer-img"></div>
                    <div class="shimmer-body">
                        <div class="shimmer-line title"></div>
                        <div class="shimmer-line desc"></div>
                        <div class="shimmer-line desc2"></div>
                        <div class="shimmer-line price"></div>
                    </div>
                </div>
                <div class="shimmer-card">
                    <div class="shimmer-img"></div>
                    <div class="shimmer-body">
                        <div class="shimmer-line title"></div>
                        <div class="shimmer-line desc"></div>
                        <div class="shimmer-line desc2"></div>
                        <div class="shimmer-line price"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Menu list -->
        <div class="menu-list" id="menuList">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <h3>Đang tải thực đơn...</h3>
            </div>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
requireRole('Customer', 'Admin', 'Staff');
document.getElementById('sidebarName').textContent = getFullName();

// ── Config ────────────────────────────────────────────────────
const catEmoji = {
    'Khai vị':     '🥗',
    'Món chính':   '🍖',
    'Lẩu & Combo': '🍲',
    'Tráng miệng': '🍮',
    'Đồ uống':     '🥤',
};

const tagClass = {
    'Best Seller': 'hot',
    'Healthy':     'sale',
    'Special':     'new',
    'Must Try':    'hot',
    'New':         'new',
};

let activeCatId = null;
let searchTimer = null;
let categories  = [];

// ── Khởi động ────────────────────────────────────────────────
async function init() {
    try {
        categories = await menuApi.getCategories();
        renderCatTabs();
        await loadMenu();
    } catch(e) {
        document.getElementById('menuList').innerHTML = `
            <div class="empty-state">
                <div class="icon">⚠️</div>
                <h3>Không kết nối được server</h3>
                <p>Vui lòng thử lại sau</p>
            </div>`;
    }
}

// ── Render tabs ───────────────────────────────────────────────
function renderCatTabs() {
    const container = document.getElementById('catTabs');
    let html = `<button class="menu-cat-tab active" onclick="filterCat(null, this)">
                    <span>🍽 Tất cả</span>
                </button>`;
    categories.forEach(c => {
        const emoji = catEmoji[c.name] || '🍽';
        html += `<button class="menu-cat-tab" onclick="filterCat(${c.id}, this)">
                    <span>${emoji} ${c.name}</span>
                 </button>`;
    });
    container.innerHTML = html;
}

// ── Filter theo category ──────────────────────────────────────
function filterCat(catId, el) {
    activeCatId = catId;
    document.querySelectorAll('.menu-cat-tab')
            .forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    loadMenu();
}

// ── Tìm kiếm debounce ────────────────────────────────────────
function onSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadMenu, 400);
}

// ── Load menu từ API ─────────────────────────────────────────
async function loadMenu() {
    const search = document.getElementById('searchInput').value.trim();
    const list = document.getElementById('menuList');
    
    // Show loading
    list.style.display = 'none';
    document.getElementById('loadingArea').style.display = 'block';
    
    try {
        const items = await menuApi.getAll(activeCatId, search || null);
        document.getElementById('menuCount').textContent =
            `${items.length} món đang phục vụ`;
        
        document.getElementById('loadingArea').style.display = 'none';
        list.style.display = '';
        renderMenu(items);
    } catch(e) {
        document.getElementById('loadingArea').style.display = 'none';
        list.style.display = '';
        list.innerHTML = `
            <div class="empty-state">
                <div class="icon">❌</div>
                <h3>Lỗi tải dữ liệu</h3>
                <p>${e.message}</p>
            </div>`;
    }
}

// ── Ảnh mặc định theo danh mục (dùng Unsplash) ────────────────
const catDefaultImage = {
    'Khai vị':     'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=300&fit=crop',
    'Món chính':   'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&h=300&fit=crop',
    'Lẩu & Combo': 'https://images.unsplash.com/photo-1563245372-f21724e3856d?w=400&h=300&fit=crop',
    'Tráng miệng': 'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=400&h=300&fit=crop',
    'Đồ uống':     'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400&h=300&fit=crop',
};

// ── Render danh sách món ──────────────────────────────────────
function renderMenu(items) {
    const list = document.getElementById('menuList');

    if (!items.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="icon">🍽</div>
                <h3>Không tìm thấy món nào</h3>
                <p>Thử tìm kiếm với từ khoá khác</p>
            </div>`;
        return;
    }

    list.innerHTML = items.map(item => {
        // Ưu tiên imageUrl từ API, fallback ảnh mặc định theo danh mục
        const imgSrc = item.imageUrl || catDefaultImage[item.categoryName] || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&h=300&fit=crop';
        const badges  = item.tags.map(t =>
            `<span class="menu-badge ${tagClass[t] || 'sale'}">${t}</span>`
        ).join('');
        const unavailable = !item.isAvailable ? 'unavailable' : '';

        return `
        <div class="menu-item ${unavailable}">
            <div class="menu-item-img-wrap">
                <img class="menu-item-img" src="${imgSrc}"
                     alt="${item.name}"
                     onerror="this.src='${catDefaultImage[item.categoryName] || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&h=300&fit=crop'}'">
                <div class="menu-item-badges">${badges}</div>
            </div>

            <div class="menu-item-body">
                <div class="menu-item-top">
                    <div class="menu-item-category">${item.categoryName}</div>
                    <div class="menu-item-name">${item.name}</div>
                    ${item.description
                        ? `<div class="menu-item-desc">${item.description}</div>`
                        : ''}
                </div>
                <div class="menu-item-footer">
                    <div class="menu-item-price">
                        ${item.price.toLocaleString('vi-VN')}<span class="unit">đ</span>
                    </div>
                    <button class="btn-book-table" onclick="goBooking()">
                        📅 Đặt bàn
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function goBooking() {
    window.location.href = 'booking.html';
}

init();
</script>
</body>
</html>
